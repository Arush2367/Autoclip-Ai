name: Security checks

on:
  push:
    branches: [main, feature/meta-integration-ready]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit tools and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run Bandit static security checks
        run: bandit -q -r backend -ll
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
